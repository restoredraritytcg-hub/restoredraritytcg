# Keeps the card-name suggestions current: on the 1st and 15th of every month this rebuilds
# portal/cards.json from TCGdex (tools/build_card_catalog.py) and commits it only if new cards
# came out. GitHub Pages then republishes the site on its own.
# Run it any time by hand: GitHub → Actions → "Update card list" → Run workflow.
name: Update card list

on:
  schedule:
    - cron: '17 11 1,15 * *'   # 1st and 15th, 11:17 UTC (5:17 AM Central standard time / 6:17 AM daylight time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-card-list
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build the card list from TCGdex
        # TCGdex is a free service and sometimes busy: the builder retries each request, and if the
        # whole build still fails it waits 10 minutes and tries again (3 tries in all).
        run: |
          for attempt in 1 2 3; do
            if python tools/build_card_catalog.py "$RUNNER_TEMP/cards.json"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::TCGdex didn't finish answering (try $attempt of 3). Trying again in 10 minutes."
              sleep 600
            fi
          done
          echo "::error::TCGdex was unavailable for all 3 tries. The live card list was not changed; the next scheduled run will try again."
          exit 1

      - name: Compare with the live list
        id: cmp
        run: python tools/compare_card_catalog.py portal/cards.json "$RUNNER_TEMP/cards.json" >> "$GITHUB_OUTPUT"

      - name: Commit the new list
        if: steps.cmp.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.cmp.outputs.summary }}
        run: |
          cp "$RUNNER_TEMP/cards.json" portal/cards.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/cards.json
          git commit -m "Card list update: $SUMMARY"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report
        env:
          CHANGED: ${{ steps.cmp.outputs.changed }}
          SUMMARY: ${{ steps.cmp.outputs.summary }}
        run: |
          if [ "$CHANGED" = "true" ]; then echo "### Card list updated: $SUMMARY" >> "$GITHUB_STEP_SUMMARY";
          else echo "### No new cards since the last update ($SUMMARY)" >> "$GITHUB_STEP_SUMMARY"; fi
