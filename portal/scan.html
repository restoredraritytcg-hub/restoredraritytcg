<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Scan Station — Restored Rarity</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="RR Portal">
<meta name="theme-color" content="#0f1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="portal.css">
<script src="config.js"></script>
<script src="centering.js"></script>
<style>
  .station{display:grid;grid-template-columns:360px 1fr;gap:16px;align-items:start}
  @media(max-width:900px){.station{grid-template-columns:1fr}}
  .seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{flex:1;background:var(--panel2);border:0;padding:8px 6px;cursor:pointer;font-size:13px;color:var(--fg)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button.on{background:var(--gold);color:#111;font-weight:600}
  .watch{display:flex;align-items:center;gap:8px;padding:10px;border-radius:8px;background:var(--panel2);margin-top:8px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:none}
  .dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(74,222,128,.15);animation:pulse 2s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(74,222,128,.05)}}
  .drop2{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);margin-top:10px}
  .drop2.over{border-color:var(--gold);color:var(--gold)}
  .next{font-size:20px;font-weight:700;color:var(--gold);margin:4px 0}
  .slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .slot h3{margin:0 0 8px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pair .ph{aspect-ratio:5/7;background:var(--panel2);border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;overflow:hidden}
  .pair img{width:100%;height:100%;object-fit:contain;display:block}
  .pair .cap{font-size:12px;color:var(--muted);margin-top:4px;min-height:34px}
  .log{font-size:13px;max-height:260px;overflow:auto}
  .log div{padding:5px 0;border-bottom:1px solid var(--line)}
  .log .err{color:var(--red)} .log .ok{color:var(--green)}
  .cardlist{font-size:13px;margin-top:8px;max-height:230px;overflow:auto}
  .cardlist div{display:flex;gap:6px;padding:4px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .cardlist div.cur{color:var(--gold)}
  .cardlist .st{margin-left:auto;color:var(--muted);white-space:nowrap}
  .big-hint{padding:26px;text-align:center;color:var(--muted)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--gold);border-radius:50%;
    animation:spin 1s linear infinite;vertical-align:-2px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="demo"></div>
<header class="top" id="topbar" hidden>
  <div class="brand">Restored Rarity · Scan station</div>
  <nav>
    <a href="admin.html#/">Submissions</a>
    <a href="admin.html#/cards">All cards</a>
    <a href="admin.html#/customers">Customers</a>
    <a href="scan.html" class="on">Scan station</a>
  </nav>
  <button class="btn sm" id="signout">Sign out</button>
</header>
<main class="wrap" id="app" style="max-width:1300px"><div class="loading">Loading…</div></main>
<script type="module" src="scan.js"></script>
</body>
</html>
