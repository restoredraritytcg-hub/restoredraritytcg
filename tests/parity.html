<!doctype html><meta charset="utf-8"><title>scanproc parity</title>
<script type="module">
import * as P from "../portal/scanproc.js";
window.runCase = async (url, defaultDpi, maxCards) => {
  const blob = await (await fetch(url)).blob();
  const file = new File([blob], url.split("/").pop(), { type: blob.type });
  const t0 = performance.now();
  const meta = await P.fileDpi(file);
  const bmp = await createImageBitmap(file);
  const { cards, dpi } = P.detectCards(bmp, bmp.width, bmp.height, meta || defaultDpi, maxCards);
  const out = [];
  for (const c of cards) {
    const m = 0.25 * dpi, [x, y, w, h] = c.box;
    const x0 = Math.max(0, Math.floor(x - m)), y0 = Math.max(0, Math.floor(y - m));
    const x1 = Math.min(bmp.width, Math.ceil(x + w + m)), y1 = Math.min(bmp.height, Math.ceil(y + h + m));
    const reg = P.canvas(x1 - x0, y1 - y0);
    reg.getContext("2d").drawImage(bmp, x0, y0, x1 - x0, y1 - y0, 0, 0, x1 - x0, y1 - y0);
    const cr = P.cropCard(reg, x1 - x0, y1 - y0, dpi);
    const cw = cr.canvas.width, ch = cr.canvas.height;
    const data = cr.canvas.getContext("2d").getImageData(0, 0, cw, ch);
    const cen = P.measureCentering(data, dpi);
    out.push({ w: cw, h: ch, ok: cr.ok, lr: cen.summary.lr, tb: cen.summary.tb, widths: cen.summary.widths_in,
               all_found: cen.summary.all_found, boxes: Object.keys(P.detailRegions(cw, ch, dpi).boxes).length });
  }
  return { metaDpi: meta, dpi, ms: Math.round(performance.now() - t0), cards: out };
};
window.ready = true;
</script>
